apiVersion: v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: hello-world
        visualize: "true"
    spec:
      containers:
      - name: hello-world-pod
        image: dstar55/docker-hello-world-spring-boot:latest
        ports:
        - containerPort: 8080   # app inside container listens on 8080
---
apiVersion: v1
kind: Service
metadata:
  labels:
    visualize: "true"
  name: hello-world-service
spec:
  selector:
    app: hello-world
  ports:
  - name: http
    protocol: TCP
    port: 30080        # ← This is now the Service port (NO conflict)
    targetPort: 8080   # ← Container still listens on 8080
  type: ClusterIP
